name: Release

# Tags only.
#
# This published on every merge to main: a multi-architecture build for changes
# that were often a paragraph of documentation, and `latest` moving each time,
# so a `docker compose pull` could change what a deployment ran without anybody
# deciding to.
#
# Building still happens on every pull request, in ci.yml, which is where a
# broken Dockerfile should be caught. Only publishing is tied to a tag, so
# `latest` means the most recent release rather than the most recent merge.
#
# workflow_dispatch stays for republishing a tag whose run failed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: publish image
    runs-on: ubuntu-latest
    # While this gateway lived in the monorepo, its image was built by a job
    # that built all six together and pushed none of them. Split out, it has to
    # publish its own or the compose files in the core repository reference a
    # tag that does not exist — which is a worse failure than not having one,
    # because it looks like it should work.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/certpilot/gateway-acme
          # latest=auto attaches `latest` to a semver tag and nothing else, so a
          # prerelease or a manual branch run cannot claim it.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
